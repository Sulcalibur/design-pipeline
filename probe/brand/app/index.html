<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand interview</title>
<style>
  :root{color-scheme:light;--ink:#1b1a18;--muted:#6d675e;--paper:#f7f4ee;--card:#fffdf8;--line:#e2dbcd;--accent:#7a4b2a;--ok:#2f6b4f;--warn:#8a5a12;--bad:#8c2f2f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
  header.top{position:sticky;top:0;z-index:5;background:rgba(247,244,238,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .bar{max-width:1240px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:18px}
  .bar h1{font:500 20px/1.2 Georgia,serif;margin:0}
  .bar .spacer{flex:1}
  .save{font-size:12px;color:var(--muted)}
  .progress{height:4px;background:var(--line)}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:32px;padding:28px 24px 80px}
  aside{position:sticky;top:96px;align-self:start}
  aside ol{list-style:none;margin:0;padding:0}
  aside li{margin:0 0 2px}
  aside button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;font:inherit;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  aside button:hover{background:#efe9dc;color:var(--ink)}
  aside button[aria-current="true"]{background:#efe9dc;color:var(--ink);font-weight:600}
  aside small{color:var(--muted);font-variant-numeric:tabular-nums}
  main{min-width:0}
  .qhead{display:flex;align-items:center;gap:10px;margin:0 0 6px;color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  h2{font:500 28px/1.3 Georgia,serif;margin:0 0 8px}
  .help{color:var(--muted);margin:0 0 18px;max-width:64ch}
  .why{color:#5a5448;margin:-8px 0 6px;font-size:13.5px;max-width:64ch}
  .why strong{font-weight:600;color:var(--ink)}
  .tbchint{color:var(--muted);font-size:13px;font-style:italic;border-left:2px solid var(--line);padding-left:10px;margin:-4px 0 18px}
  .field{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
  input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:11px 12px}
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .chips{display:flex;gap:6px;border:0;padding:0;margin:16px 0 0}
  .chips legend{font-size:12px;color:var(--muted);padding:0 0 6px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;width:1px;height:1px}
  .chip span{display:inline-block;padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:12px;cursor:pointer;background:#fff}
  .chip input:checked + span{border-color:var(--accent);color:var(--accent);font-weight:600}
  .chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .source{margin-top:14px}
  .source label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .swatch{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:inline-block;vertical-align:middle}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
  .btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 16px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .review h3{font:500 18px/1.3 Georgia,serif;margin:26px 0 8px}
  .review ul{list-style:none;margin:0;padding:0}
  .review li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .review li button{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;flex:1}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .dot.verified{background:var(--ok)} .dot.assumption{background:var(--warn)} .dot.tbc{background:var(--bad)}
  .status{font-size:11px;color:var(--muted);text-transform:lowercase}
  .dials{width:100%;border-collapse:collapse;margin-top:6px}
  .dials th,.dials td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
  .dials select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff}
  .out{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff;display:none}
  .out pre{white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto}
  .skip{font-size:12px;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
  .pairings{margin:0 0 18px}
  .pairgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .paircard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
  .paircard:hover{border-color:#c9bda9}
  .paircard.chosen{border-color:var(--accent);outline:1px solid var(--accent);outline-offset:-1px}
  .pairname{font:600 11px/1 ui-sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .spec-display{font-size:26px;line-height:1.15;color:var(--ink)}
  .spec-body{font-size:13.5px;line-height:1.5;color:#3b3730}
  .spec-ui{font-size:12px;color:var(--muted)}
  .pairwhy{font-size:11.5px;line-height:1.45;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}
  .lib{margin:18px 0 0;border-top:1px solid var(--line);padding-top:14px}
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .libcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
  .libcard:hover{border-color:#c9bda9}
  .libcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:#ece6da}
  .libcard span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fontmark, .fontpreview{display:grid;place-items:center;aspect-ratio:4/3;border-radius:4px;background:#ece6da;color:#3b3730;font:600 34px/1 var(--_eagle-font, Georgia, serif);overflow:hidden}
  .checks{margin:26px 0 8px}
  .checks h4{font:600 13px/1.3 ui-sans-serif;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .checktable{width:100%;border-collapse:collapse;font-size:12.5px}
  .checktable th,.checktable td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  .checktable .ok{color:var(--ok);font-weight:600}
  .checktable .bad{color:var(--bad);font-weight:600}
  @media(max-width:860px){.shell{grid-template-columns:1fr}aside{position:static;order:2}main{order:1}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 id="title">Brand interview</h1>
    <span class="spacer"></span>
    <span class="save" id="save" aria-live="polite">unsaved</span>
  </div>
  <div class="progress" role="progressbar" aria-label="Answered" aria-valuemin="0" aria-valuemax="100"><i id="pbar"></i></div>
</header>
<div class="shell">
  <aside>
    <ol id="sections"></ol>
  </aside>
  <main id="main">
    <p class="help">Loading…</p>
  </main>
</div>
<script src="brand.js"></script>
</body>
</html>
